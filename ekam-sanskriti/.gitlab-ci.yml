stages:
  - build
  - test
  - deploy

build_job:
  stage: build
  image: node:20
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - .next/

test_job:
  stage: test
  image: node:20
  script:
    - npm ci
    - npm run lint

pages:
  stage: deploy
  image: node:20
  script:
    - npm ci
    - npm run build
    - mv out public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
